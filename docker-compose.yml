# StarVote 部署配置 — 复制本目录 .env.example 为 .env 并填写，
# HOSTS 支持多个站点（逗号分隔）。将 <owner> 换成你的 GitHub 用户名。
services:
  starvote:
    image: ghcr.io/<owner>/star-vote:latest
    container_name: starvote
    ports:
      - "${HOST_PORT:-5556}:5556"
    volumes:
      - starvote_data:/data
    environment:
      # 多站点域名，用逗号分隔；由 .env 注入
      - HOSTS=${HOSTS:?请在 .env 中设置 HOSTS，多个域名用逗号分隔}
    restart: unless-stopped

volumes:
  starvote_data: